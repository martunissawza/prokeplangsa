<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prodi DIII Keperawatan Langsa</title>
<style>
:root{--primary:#0b6b63;--secondary:#0f8b7e;--bg:#f4faf9;--text:#243b39}
*{box-sizing:border-box;scroll-behavior:smooth}
body{margin:0;font-family:Arial,sans-serif;color:var(--text);background:#fff;line-height:1.6}
header{position:sticky;top:0;background:#fff;box-shadow:0 2px 10px #0001;z-index:10}
.nav{max-width:1100px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{font-weight:bold;color:var(--primary);font-size:18px}.logo small{display:block;color:#777;font-size:11px;font-weight:normal}
nav{display:flex;gap:6px;flex-wrap:wrap}nav a{padding:8px 11px;border-radius:7px;font-size:13px;font-weight:bold}nav a:hover{background:var(--bg);color:var(--primary)}
.hero{background:linear-gradient(135deg,#0b6b63,#12302d);color:#fff;padding:85px 20px}
.hero-inner{max-width:1100px;margin:auto}.hero h1{font-size:44px;margin:10px 0}.hero p{max-width:720px;font-size:18px}
.btn{display:inline-block;padding:11px 17px;border-radius:8px;background:#fff;color:var(--primary);font-weight:bold;margin:8px 6px 0 0}
section{padding:65px 20px}.container{max-width:1100px;margin:auto}
.title{font-size:32px;margin:0 0 10px;color:#12302d}.lead{color:#687875}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:25px}.card{padding:22px;border:1px solid #e1ecea;border-radius:12px;background:#fff;box-shadow:0 4px 18px #0000000b}.card h3{margin-top:0;color:var(--primary)}
.alt{background:var(--bg)}footer{background:#12302d;color:#fff;padding:35px 20px}
@media(max-width:800px){.nav{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:34px}}
@media(max-width:550px){nav{display:grid;grid-template-columns:1fr 1fr;width:100%}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="nav">
  <div class="logo" id="siteLogo">PRODI DIII Keperawatan Langsa<small>Poltekkes Kemenkes Aceh</small></div>
  <nav id="menu"></nav>
</div></header>

<main>
<section class="hero" id="beranda"><div class="hero-inner">
  <div id="heroContent"></div>
</div></section>

<section id="profil"><div class="container">
  <h2 class="title" id="profilTitle">Profil Program Studi</h2>
  <p class="lead" id="profilText"></p>
  <div class="card" id="profilDetail"></div>
</div></section>

<section class="alt" id="visi"><div class="container">
  <h2 class="title">Visi & Misi</h2>
  <div class="grid">
    <div class="card"><h3>Visi</h3><p id="visiText"></p></div>
    <div class="card"><h3>Misi</h3><p id="misiText"></p></div>
    <div class="card"><h3>Tujuan</h3><p id="tujuanText"></p></div>
  </div>
</div></section>

<section id="akademik"><div class="container">
  <h2 class="title">Akademik</h2><p class="lead" id="akademikText"></p>
  <div class="grid" id="akademikCards"></div>
</div></section>

<section class="alt" id="kemahasiswaan"><div class="container">
  <h2 class="title">Kemahasiswaan</h2><p id="mahasiswaText"></p>
</div></section>

<section id="berita"><div class="container">
  <h2 class="title">Berita & Informasi</h2><div class="grid" id="beritaCards"></div>
</div></section>

<section class="alt" id="kontak"><div class="container">
  <h2 class="title">Kontak</h2><p id="kontakText"></p>
</div></section>
</main>

<footer><div class="container" id="footerText"></div></footer>

<script>
const DEFAULT={
  siteName:"PRODI DIII Keperawatan Langsa", institution:"Poltekkes Kemenkes Aceh",
  heroTitle:"DIII Keperawatan Langsa",
  heroText:"Website informasi Program Studi DIII Keperawatan Langsa.",
  primary:"#0b6b63", bg:"#f4faf9", heroBg:"#12302d",
  profilTitle:"Profil Program Studi",
  profilText:"Program Studi DIII Keperawatan Langsa menyelenggarakan pendidikan vokasi keperawatan untuk menghasilkan lulusan yang kompeten, profesional dan berkarakter.",
  profilDetail:"Program studi terus mengembangkan pendidikan, pembelajaran, praktik laboratorium, praktik klinik, penelitian, pengabdian kepada masyarakat dan kerja sama.",
  visi:"Menjadi program studi yang menghasilkan tenaga keperawatan vokasional yang kompeten dan profesional.",
  misi:"Menyelenggarakan pendidikan keperawatan yang bermutu, mengembangkan penelitian dan pengabdian kepada masyarakat, serta memperkuat kerja sama.",
  tujuan:"Menghasilkan lulusan yang memiliki pengetahuan, keterampilan dan sikap profesional sesuai kebutuhan pelayanan kesehatan.",
  akademik:"Informasi akademik, kurikulum, pembelajaran dan kegiatan praktik mahasiswa.",
  mahasiswa:"Informasi kegiatan mahasiswa, organisasi, prestasi, layanan kemahasiswaan dan kegiatan pengembangan diri.",
  berita:[
    ["Pengumuman","Informasi terbaru Program Studi DIII Keperawatan Langsa."],
    ["Kegiatan Akademik","Informasi kegiatan pembelajaran dan praktik mahasiswa."],
    ["Kegiatan Mahasiswa","Berita kegiatan dan prestasi mahasiswa."]
  ],
  menu:[
    ["Beranda","#beranda"],["Profil","#profil"],["Visi & Misi","#visi"],
    ["Akademik","#akademik"],["Mahasiswa","#kemahasiswaan"],["Berita","#berita"],["Kontak","#kontak"]
  ],
  cards:[
    ["Kurikulum","Informasi kurikulum dan proses pembelajaran."],
    ["Laboratorium","Informasi praktik laboratorium keperawatan."],
    ["Praktik Klinik","Informasi pelaksanaan praktik klinik mahasiswa."]
  ],
  kontak:"Alamat kampus | Telepon: - | Email: - | Website: -",
  footer:"© 2026 Prodi DIII Keperawatan Langsa. Semua hak dilindungi."
};

function getData(){try{return {...DEFAULT,...JSON.parse(localStorage.getItem("prodiLangsa"))}}catch(e){return DEFAULT}}
function render(){
 const d=getData();
 document.documentElement.style.setProperty("--primary",d.primary);
 document.documentElement.style.setProperty("--bg",d.bg);
 document.getElementById("siteLogo").innerHTML=d.siteName+"<small>"+d.institution+"</small>";
 document.getElementById("menu").innerHTML=d.menu.map(x=>`<a href="${x[1]}">${x[0]}</a>`).join("");
 document.querySelector(".hero").style.background=`linear-gradient(135deg,${d.primary},${d.heroBg})`;
 document.getElementById("heroContent").innerHTML=`<h1>${d.heroTitle}</h1><p>${d.heroText}</p><a class="btn" href="#profil">Jelajahi Prodi</a>`;
 document.getElementById("profilTitle").textContent=d.profilTitle;
 document.getElementById("profilText").textContent=d.profilText;
 document.getElementById("profilDetail").textContent=d.profilDetail;
 document.getElementById("visiText").textContent=d.visi;
 document.getElementById("misiText").textContent=d.misi;
 document.getElementById("tujuanText").textContent=d.tujuan;
 document.getElementById("akademikText").textContent=d.akademik;
 document.getElementById("mahasiswaText").textContent=d.mahasiswa;
 document.getElementById("akademikCards").innerHTML=d.cards.map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("");
 document.getElementById("beritaCards").innerHTML=d.berita.map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join("");
 document.getElementById("kontakText").textContent=d.kontak;
 document.getElementById("footerText").textContent=d.footer;
}
render();
</script>
</body>
</html>
