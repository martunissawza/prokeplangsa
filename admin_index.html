<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - PRODI DIII Keperawatan Langsa</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#eef1f5;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .box{width:min(420px,92%);background:#fff;padding:32px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
    h1{margin:0 0 8px;text-align:center;font-size:24px;color:#24343a}
    p{color:#667085;text-align:center;margin:0 0 24px}
    label{display:block;margin:14px 0 6px;font-weight:600;color:#344054}
    input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:8px;font-size:16px}
    button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:#24343a;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
    button:hover{background:#18272c}
    .error{display:none;color:#b42318;background:#fef3f2;border:1px solid #fecdca;padding:10px;border-radius:8px;margin-top:14px;text-align:center}
    .note{font-size:12px;margin-top:20px;color:#98a2b3}
  </style>
</head>
<body>
  <main class="box" id="loginBox">
    <h1>Admin Website</h1>
    <p>PRODI DIII Keperawatan Langsa</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Login</button>
      <div class="error" id="error">Username atau password salah.</div>
    </form>
    <p class="note">Catatan: login ini hanya pengunci tampilan sederhana, bukan keamanan server.</p>
  </main>

  <script>
    const USERNAME = "admin";
    const PASSWORD = "admin";

    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const error = document.getElementById("error");

      if (username === USERNAME && password === PASSWORD) {
        document.body.innerHTML = "";
        const script = document.createElement("script");
        script.src = "https://unpkg.com/netlify-cms@2.10.192/dist/netlify-cms.js";
        document.body.appendChild(script);
      } else {
        error.style.display = "block";
      }
    });
  </script>
</body>
</html>
